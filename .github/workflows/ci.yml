name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref so pushes don't pile up macOS minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smartmarket/smartmarket-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: smartmarket/smartmarket-backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: pytest -q

  ios-build:
    name: iOS build
    # macos-15 ships Xcode 16+, required for this project's objectVersion 77.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Sync merge regression tests
        run: swift test --disable-sandbox
      - name: Build (compile check)
        run: |
          xcodebuild \
            -project smartmarket.xcodeproj \
            -scheme smartmarket \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            build CODE_SIGNING_ALLOWED=NO
