<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#111}canvas{display:block;height:100vh;margin:auto}</style>
</head><body><canvas id="cv"></canvas>
<script src="timeline.js"></script>
<script src="layers.js"></script>
<script>
// "Noticed": the real Nourlo mascot (the app's own render) gets shy, blushes and covers its mouth.
const W = 1080, H = 1920, FPS = 30, NF = Math.round(T.dur * FPS);
const cv = document.getElementById('cv'); cv.width = W; cv.height = H;
const X = cv.getContext('2d', { willReadFrequently: true });

const C = { white: '#FBF7F8', pink: '#E7AFC0', pinkDeep: '#D98FA6', dark: '#0E0E15', navy: '#1A2647', navyLight: '#3A4E86', ink: '#141B33',
  blush: '240,104,128', brand: '#E8698A', mint: '#6FE0C8', text: '#F5F5F7', dim: '#9A9AA0' };

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut = t => 1 - Math.pow(1 - t, 3);
const eIn = t => t * t * t;
const eInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eBack = t => { const c = 1.6; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
/** A settling wobble after time a: 0 before, decays to 0. */
const wobble = (t, a, freq = 16, decay = 6) => t < a ? 0 : Math.exp(-(t - a) * decay) * Math.sin((t - a) * freq);

const IMG = {};
function load(src) { return new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = src; }); }

// ---------- the mascot (its own 512 × 512 space, feet at y 475) ----------
const EYES = [[200, 278], [317, 278]];
const S = 1.62, CX = 540, CY = 820; // mascot centre on screen and its scale

function eyeOpen(x, y, rx, ry, sparkle) {
  const g = X.createRadialGradient(x - rx * 0.3, y - ry * 0.35, 1, x, y, ry * 1.1);
  g.addColorStop(0, C.navyLight); g.addColorStop(0.55, C.navy); g.addColorStop(1, C.ink);
  X.fillStyle = g; X.beginPath(); X.ellipse(x, y, rx, ry, 0, 0, 6.283); X.fill();
  X.fillStyle = 'rgba(255,255,255,0.95)';
  X.beginPath(); X.ellipse(x + rx * 0.34, y - ry * 0.38, rx * (sparkle ? 0.36 : 0.29), ry * (sparkle ? 0.33 : 0.26), 0, 0, 6.283); X.fill();
  if (sparkle) { X.globalAlpha = 0.85 * sparkle; X.beginPath(); X.arc(x - rx * 0.32, y + ry * 0.38, rx * 0.16, 0, 6.283); X.fill(); X.globalAlpha = 1; }
}
function eyeClosed(x, y, r, happy) {
  X.strokeStyle = C.navy; X.lineWidth = 5.5; X.lineCap = 'round'; X.beginPath();
  if (happy) X.arc(x, y + 7, r, Math.PI + 0.45, Math.PI * 2 - 0.45); // ∩, squeezed shut
  else X.arc(x, y - 4, r, 0.35, Math.PI - 0.35);                      // a blink
  X.stroke();
}

function drawMascot(t, f) {
  // hop in, breathing, the shy shrink, sway
  const hop = t < T.hopLand ? -Math.sin(Math.PI * (0.5 + 0.5 * eOut(t / T.hopLand))) * 0 + lerp(420, 0, eOut(t / T.hopLand)) : 0;
  const landSquash = wobble(t, T.hopLand, 18, 7) * 0.09;
  const breathe = Math.sin(t * 2.4) * 0.008;
  const shy = eOut(prog(t, T.squint, T.squint + 0.35)) * (1 - eOut(prog(t, T.recover[0], T.recover[1])));
  const sway = Math.sin((t - T.sparkle) * 2.1) * 0.035 * shy * (t > T.sparkle ? 1 : 0);
  const morph = eInOut(prog(t, T.morph[0], T.morph[1]));
  const sq = landSquash + breathe + shy * 0.025 + wobble(t, T.notice, 22, 8) * 0.04;
  X.save();
  X.translate(CX, CY + hop + (475 - 256) * S);           // feet
  X.rotate(sway);
  X.scale(S * (1 + sq) * (1 - 0.62 * morph), S * (1 - sq) * (1 - 0.62 * morph));
  X.translate(-256, -475);
  X.globalAlpha = 1 - prog(t, T.morph[0] + 0.25, T.morph[1]);

  X.drawImage(IMG.base, 0, 0);

  // blush
  const blushIn = eOut(prog(t, T.sparkle - 0.15, T.sparkle + 0.4)) * (1 - eOut(prog(t, T.recover[0], T.recover[1] + 0.3)));
  if (blushIn > 0.01) {
    const pulse = 0.85 + 0.15 * Math.sin((t - T.sparkle) * 3.2);
    X.save(); X.filter = 'blur(7px)';
    X.fillStyle = `rgba(${C.blush},${0.6 * blushIn * pulse})`;
    for (const [bx, by] of [[176, 305], [341, 305]]) { X.beginPath(); X.ellipse(bx, by, 27, 15, 0, 0, 6.283); X.fill(); }
    X.restore();
    // three little blush lines on each cheek
    X.save(); X.strokeStyle = `rgba(214,72,100,${0.55 * blushIn})`; X.lineWidth = 2.6; X.lineCap = 'round';
    for (const bx of [176, 341]) for (let k = -1; k <= 1; k++) { X.beginPath(); X.moveTo(bx + k * 9 - 3, 311); X.lineTo(bx + k * 9 + 3, 299); X.stroke(); }
    X.restore();
  }

  // eyes
  const look = (eInOut(prog(t, T.lookAway[0], T.lookAway[0] + 0.25)) - eInOut(prog(t, T.lookAway[1] - 0.25, T.lookAway[1]))) * -7;
  const startle = eOut(prog(t, T.notice, T.notice + 0.15)) * (1 - prog(t, T.squint - 0.05, T.squint));
  const shut = t >= T.squint && t < T.sparkle;
  const sparkle = eBack(prog(t, T.sparkle, T.sparkle + 0.3)) * (1 - eOut(prog(t, T.recover[0], T.recover[1])));
  let open = 1; for (const b of T.blinks) { const d = t - b; if (d >= 0 && d < 0.18) open = Math.min(open, Math.abs(d - 0.09) / 0.09); }
  for (const [ex, ey] of EYES) {
    if (shut) { eyeClosed(ex, ey, 13, true); continue; }
    if (open < 0.25) { eyeClosed(ex, ey, 13, false); continue; }
    const grow = 1 + startle * 0.18 + sparkle * 0.16;
    X.save(); X.translate(ex + look, ey); X.scale(1, open); eyeOpen(0, 0, 14.5 * grow, 15.5 * grow, sparkle > 0.05 ? clamp(sparkle) : 0); X.restore();
  }

  // hands: at the sides, then up over the mouth
  const up = eInOut(prog(t, T.cover[0], T.cover[1])) * (1 - eInOut(prog(t, T.recover[0], T.recover[1])));
  const pat = Math.sin((t - T.cover[1]) * 5.5) * 2.2 * (t > T.cover[1] ? up : 0);
  LAYERS.hands.forEach((h, i) => {
    const side = i === 0 ? -1 : 1;
    const tx = 259 + side * 25, ty = 316 + pat * (i ? 1 : -1) + (i ? -4 : 4);
    const x = lerp(h.x, tx, up), y = lerp(h.y, ty, up) - Math.sin(Math.PI * up) * 26;
    const a = side * -0.5 * up, s = 1 - 0.16 * up;
    if (up > 0.02) { // a soft shadow where the hand presses on the bowl
      X.save(); X.filter = 'blur(6px)'; X.fillStyle = `rgba(150,70,80,${0.22 * up})`; X.beginPath(); X.ellipse(x + side * -3, y + 9, 30, 20, a, 0, 6.283); X.fill(); X.restore();
    }
    X.save(); X.translate(x, y); X.rotate(a); X.scale(s, s); X.drawImage(IMG.hands[i], -h.cx, -h.cy); X.restore();
  });
  X.restore();
}

// ---------- end card ----------
function roundRect(x, y, w, h, r) { X.beginPath(); X.roundRect(x, y, w, h, r); }
function drawEnd(t) {
  const m = eInOut(prog(t, T.morph[0] + 0.15, T.morph[1]));
  if (m <= 0) return;
  const upP = eInOut(prog(t, T.iconUp[0], T.iconUp[1]));
  const size = lerp(300, 340, upP), cy = lerp(CY + 120, 720, upP);
  X.save(); X.globalAlpha = m; X.translate(540, cy); X.scale(0.6 + 0.4 * m, 0.6 + 0.4 * m);
  X.shadowColor = 'rgba(232,105,138,0.35)'; X.shadowBlur = 60;
  roundRect(-size / 2, -size / 2, size, size, size * 0.225); X.save(); X.clip(); X.drawImage(IMG.icon, -size / 2, -size / 2, size, size); X.restore();
  X.restore();

  const n = eOut(prog(t, T.name, T.name + 0.4));
  if (n > 0) { X.save(); X.globalAlpha = n; X.fillStyle = C.text; X.font = '800 92px Nunito'; X.textAlign = 'center'; X.fillText('Nourlo', 540, 1010 + (1 - n) * 24); X.restore(); }

  // the search bar: a coloured line that opens into a field, then the name is typed
  const b = prog(t, T.bar[0], T.bar[1]);
  if (b > 0) {
    const grow = eOut(clamp(b / 0.55)), open = eInOut(prog(b, 0.5, 1));
    const w = 680 * grow, h = lerp(14, 104, open), x = 540 - w / 2, y = 1120 - h / 2;
    X.save();
    const g = X.createLinearGradient(x, 0, x + w, 0); g.addColorStop(0, C.mint); g.addColorStop(0.5, '#FFFFFF'); g.addColorStop(1, C.brand);
    X.fillStyle = g; roundRect(x - 5, y - 5, w + 10, h + 10, (h + 10) / 2); X.fill();
    X.fillStyle = open > 0.5 ? '#FFFFFF' : `rgba(255,255,255,${open * 2})`; roundRect(x, y, w, h, h / 2); X.fill();
    if (open > 0.85) {
      // magnifier
      X.strokeStyle = '#6E6E78'; X.lineWidth = 6; X.lineCap = 'round';
      X.beginPath(); X.arc(x + 62, 1114, 17, 0, 6.283); X.stroke(); X.beginPath(); X.moveTo(x + 75, 1127); X.lineTo(x + 88, 1140); X.stroke();
      const word = 'Nourlo', k = Math.floor(word.length * prog(t, T.type[0], T.type[1]) + 0.001);
      X.fillStyle = '#16161C'; X.font = '700 52px Nunito'; X.textAlign = 'left'; X.textBaseline = 'middle';
      X.fillText(word.slice(0, k), x + 112, 1122);
      const caret = (t < T.type[1] || Math.floor((t - T.type[1]) * 2.2) % 2 === 0);
      if (caret) { const cw = X.measureText(word.slice(0, k)).width; X.fillStyle = C.brand; X.fillRect(x + 116 + cw, 1094, 5, 56); }
    }
    X.restore();
  }
  const s = eOut(prog(t, T.store, T.store + 0.4));
  if (s > 0) { X.save(); X.globalAlpha = s; X.fillStyle = C.dim; X.font = '700 44px Nunito'; X.textAlign = 'center'; X.fillText('Download on the App Store', 540, 1270 + (1 - s) * 16); X.restore(); }
}

// ---------- the frame ----------
function render(f) {
  const t = f / FPS;
  X.setTransform(1, 0, 0, 1, 0, 0); X.imageSmoothingQuality = 'high'; X.globalAlpha = 1; X.globalCompositeOperation = 'source-over'; X.filter = 'none'; X.shadowColor = 'transparent'; X.shadowBlur = 0;
  X.fillStyle = C.white; X.fillRect(0, 0, W, H);

  // the pink spreads out from the bowl when it's noticed, and drains away after
  const spread = eInOut(prog(t, T.notice, T.pinkFull)) * (1 - eInOut(prog(t, T.white[0], T.white[1])));
  if (spread > 0) {
    const R = 120 + 1900 * spread, g = X.createRadialGradient(CX, CY + 60, Math.max(0, R - 520), CX, CY + 60, R);
    g.addColorStop(0, C.pink); g.addColorStop(1, 'rgba(231,175,192,0)');
    X.fillStyle = g; X.fillRect(0, 0, W, H);
  }
  // a soft rosy glow right around the bowl as it blushes
  const halo = eOut(prog(t, T.notice, T.notice + 0.4)) * (1 - prog(t, T.white[0], T.white[1]));
  if (halo > 0) { const g = X.createRadialGradient(CX, CY, 100, CX, CY, 560); g.addColorStop(0, `rgba(255,214,224,${0.55 * halo})`); g.addColorStop(1, 'rgba(255,214,224,0)'); X.fillStyle = g; X.fillRect(0, 0, W, H); }

  // dark for the end card
  const dark = eInOut(prog(t, T.morph[0], T.morph[1]));
  if (dark > 0) { X.fillStyle = C.dark; X.beginPath(); X.arc(CX, CY + 120, 40 + 2100 * dark, 0, 6.283); X.fill(); }

  // ground shadow
  if (t < T.morph[1]) {
    const air = t < T.hopLand ? 1 - eOut(t / T.hopLand) : 0, fade = 1 - prog(t, T.morph[0], T.morph[0] + 0.3);
    X.save(); X.filter = 'blur(14px)'; X.fillStyle = `rgba(110,60,75,${0.22 * (1 - air * 0.8) * fade})`;
    X.beginPath(); X.ellipse(CX, CY + (475 - 256) * S + 6, 230 * (1 - air * 0.4), 30, 0, 0, 6.283); X.fill(); X.restore();
    drawMascot(t, f);
  }
  drawEnd(t);
}

(async () => {
  const fonts = [new FontFace('Nunito', 'url(Nunito.ttf)', { weight: '200 1000' })];
  for (const font of fonts) { await font.load(); document.fonts.add(font); }
  IMG.base = await load(LAYERS.base); IMG.icon = await load(LAYERS.icon);
  IMG.hands = await Promise.all(LAYERS.hands.map(h => load(h.src)));
  window.READY = true;
  if (!location.search.includes('render')) {
    const t0 = performance.now();
    const loop = () => { render(Math.floor((performance.now() - t0) / 1000 * FPS) % NF); requestAnimationFrame(loop); };
    loop();
  }
})();
</script>
</body></html>
